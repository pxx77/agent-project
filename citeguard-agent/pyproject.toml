[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "citeguard"
version = "0.1.0"
description = "Evidence-grounded citation verification agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.116.1",
    "httpx==0.28.1",
    "python-multipart==0.0.20",
    "pydantic==2.11.7",
    "pypdf==6.0.0",
    "python-docx==1.2.0",
    "streamlit==1.48.0",
    "uvicorn==0.35.0",
]

[project.optional-dependencies]
# sse-starlette is pinned because mcp pulls sse-starlette>=3, which would drag in
# starlette 1.x and break fastapi==0.116.1 (starlette <0.48).
mcp = ["mcp==1.13.1", "sse-starlette==2.4.1"]
dev = ["pytest==8.4.1", "mcp==1.13.1", "sse-starlette==2.4.1"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
