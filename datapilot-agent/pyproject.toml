[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "datapilot"
version = "0.1.0"
description = "Safe SQL data analysis agent"
requires-python = ">=3.11"
dependencies = ["fastapi==0.116.1", "httpx==0.28.1", "python-multipart==0.0.20", "pydantic==2.11.7", "streamlit==1.48.0", "pandas==2.3.2", "openpyxl==3.1.5", "uvicorn==0.35.0"]

[project.optional-dependencies]
dev = ["pytest==8.4.1"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
